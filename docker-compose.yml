# =============================================================================
# VPS CI/CD — Production High-Availability Docker Compose Deployment
# 2 Backend Instances + Nginx Reverse Proxy / Load Balancer + Prometheus + Grafana
# =============================================================================

version: '3.8'

services:
  # Backend Instance 1
  backend-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
      - PG_SSL=${PG_SSL:-false}
      - DATA_DIR=/app/data
      - SESSION_DAYS=${SESSION_DAYS:-7}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-admin123}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    volumes:
      - vps_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # Optional: if deployment scripts execute docker commands
    networks:
      - vps_internal_network

  # Backend Instance 2 (High Availability & Load Balancing)
  backend-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
      - PG_SSL=${PG_SSL:-false}
      - DATA_DIR=/app/data
      - SESSION_DAYS=${SESSION_DAYS:-7}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-admin123}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    volumes:
      - vps_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vps_internal_network

  # Nginx Reverse Proxy / Frontend Static Delivery / API Load Balancer
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: always
    ports:
      - "${PROD_PORT:-19443}:80"
    depends_on:
      - backend-1
      - backend-2
    networks:
      - vps_internal_network

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vps_internal_network

  # Grafana Observability Dashboard
  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vps_internal_network

networks:
  vps_internal_network:
    driver: bridge

volumes:
  vps_data:
  prometheus_data:
  grafana_data:
