# =============================================================================
# VPS CI/CD — Staging Docker Compose Deployment
# =============================================================================

version: '3.8'

services:
  backend-staging:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
      - PG_SSL=${PG_SSL:-false}
      - DATA_DIR=/app/data
      - SESSION_DAYS=${SESSION_DAYS:-7}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-staging_admin_pass_123}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    volumes:
      - vps_staging_data:/app/data
    networks:
      - vps_staging_network

  nginx-staging:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: always
    ports:
      - "${STAGING_PORT:-19444}:80"
    depends_on:
      - backend-staging
    networks:
      - vps_staging_network

  prometheus-staging:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-19091}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    networks:
      - vps_staging_network

  grafana-staging:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "${GRAFANA_PORT:-13001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus-staging
    networks:
      - vps_staging_network

networks:
  vps_staging_network:
    driver: bridge

volumes:
  vps_staging_data:
  prometheus_staging_data:
  grafana_staging_data:
