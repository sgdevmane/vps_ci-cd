<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VPS CI/CD — Service Unavailable</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0e1118;
        background-image: radial-gradient(700px 380px at 50% -10%, rgba(124, 108, 240, 0.18), transparent 70%);
        color: #e7eaf2;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        padding: 40px 36px;
        border: 1px solid #232b3d;
        border-radius: 16px;
        background: #151a24;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        font-size: 24px;
        background: linear-gradient(135deg, #7c6cf0, #4f8cf5);
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      }
      h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 22px; font-size: 14px; line-height: 1.55; color: #8c95ab; }
      a {
        display: inline-block;
        padding: 9px 18px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #7c6cf0, #6357ed);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      a:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 108, 240, 0.5); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">⚡</div>
      <h1>Service temporarily unavailable</h1>
      <p>
        The VPS CI/CD cluster is restarting or under maintenance.
        Deploy triggers are queued by your git provider and will retry automatically.
      </p>
      <a href="/">Retry now</a>
    </div>
  </body>
</html>
